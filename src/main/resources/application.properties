# Server Configuration
server.port=8080

# ============================================================
# Option A: H2 Database in MySQL Mode (Default for Instant Testing)
# ============================================================
spring.datasource.url=jdbc:h2:mem:moviebooking;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# Option B: External MySQL Database Setup (Uncomment when running MySQL Server)
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/moviebooking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Uncomment dialect below for MySQL:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

